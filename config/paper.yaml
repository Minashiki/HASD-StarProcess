# 调参方式：直接改本文件，或复制一份新 yaml 后用 --config 指定。
# 各节按预处理阶段（P0–P4）分组；P2 网格搜索的搜索网格写在
# scripts/grid_search_bilateral.py 中，不在本文件。

# ===== P0 环境与工程：数据与 ROI =====
data:
  fits_dir: rst19                 # engineering-choice: 数据目录
  roi_file: data/roi/roi.yaml     # engineering-choice: ROI 配置路径

# ===== P1 双边滤波 =====
bilateral:
  # paper-confirmed: k=5, sigma_space=1.5, sigma_range=25
  kernel_size: 5
  sigma_space: 1.5
  sigma_range: 25
  # paper-confirmed: 论文给出 diameter 与 radius 两种核定义均支持
  kernel_definition: diameter     # diameter: 5x5 主实验; radius: 11x11 对照
  # engineering-choice: 论文 sigma_range=25 隐含 [0,255] 灰度尺度，
  # 而滤波作用于拉伸前的原始数据，需按动态范围缩放 sigma_range
  sigma_range_scale_to_dynamic_range: true

# ===== P3 对比度拉伸 =====
contrast_stretch:
  # paper-confirmed: min-max 线性拉伸到 [0,255]
  # engineering-choice: statistical 按统计范围截断高端后再归一化
  method: minmax              # minmax | statistical
  out_min: 0
  out_max: 255
  # engineering-choice: statistical 方法的参数，随时可调
  tier: balanced              # 默认档位: recall | balanced | purity
  norm: false                  # true: 截断后归一化到 [out_min, out_max]；
                              # false: 只做高端截断，保留原始灰度量级
  percentile_tiers:           # 三档灰度百分位
    recall: 99.5
    balanced: 99.9
    purity: 99.95
  upper_k: 8                  # upper 下限保护: 背景中位数 + upper_k × MAD sigma

# ===== P3 局部背景建模 =====
local_background:
  # paper-confirmed: 20x20 分块统计
  block_size: 20

# ===== P4 自适应二值化 =====
adaptive_threshold:
  # 参数化策略候选（二次开发）: "C1mu+C2*S" | "C1mu+C2*sigma_loc"
  #   即 T = C_1 * mu_loc + C_2 * S（或 sigma_loc），C_1 / C_2 独立可调，
  #   取 C_1: 1 时退化为对应的固定策略
  strategy: C1mu+C2*S
  C_1: 1                      # 参数化策略中 mu_loc 的系数
  C_2: 2                      # 参数化策略中 S / sigma_loc 的系数

# ===== P4 形态学处理 =====
morphology:
  op: open                        # none/open/close/erode/dilate/open+close
  kernel_shape: ellipse
  kernel_size: 3                  # 禁止 5x5 起步
  iterations: 1

output:
  # engineering-choice: 输出根目录；其下按阶段生成 p1_bilateral/、
  # p3_stretch_background/、p4_binary_morphology/ 子目录
  dir: outputs
  # engineering-choice: true 时除 PNG 外额外保存同名 .fits，
  # 数值/dtype 与管线中的数组一致（float32/uint8，不做显示归一化）
  save_fits: true
